name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # V1 (root) and V2 (v2/) are both static sites — no build step.
      # V2 lives at /v2/ on the deployed site as a staging mirror.
      - name: Assemble site
        run: |
          mkdir -p _site

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='docs' \
            --exclude='node_modules' \
            --exclude='_site' \
            --exclude='CLAUDE.md' \
            --exclude='DESIGN.md' \
            --exclude='WEBSITE.md' \
            --exclude='README.md' \
            --exclude='SKILL-CREATOR.md' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
